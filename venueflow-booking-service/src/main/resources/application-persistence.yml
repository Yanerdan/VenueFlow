spring:
  config:
    activate:
      on-profile: persistence
  datasource:
    url: ${VENUEFLOW_BOOKING_DB_URL}
    username: ${VENUEFLOW_BOOKING_DB_USERNAME}
    password: ${VENUEFLOW_BOOKING_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: none

venueflow:
  booking:
    confirmation-window: ${VENUEFLOW_CONFIRMATION_WINDOW:PT15M}
  collaborators:
    user-base-url: ${VENUEFLOW_USER_SERVICE_BASE_URL}
    resource-base-url: ${VENUEFLOW_RESOURCE_SERVICE_BASE_URL}
    connect-timeout-ms: ${VENUEFLOW_COLLABORATOR_CONNECT_TIMEOUT_MS:1000}
    request-timeout-ms: ${VENUEFLOW_COLLABORATOR_REQUEST_TIMEOUT_MS:2000}
    lookup-attempts: ${VENUEFLOW_RESOURCE_LOOKUP_ATTEMPTS:2}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
