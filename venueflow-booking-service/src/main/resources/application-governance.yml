spring:
  config:
    activate:
      on-profile: governance
    import:
      - optional:nacos:venueflow-common.yml?group=${VENUEFLOW_NACOS_GROUP:VENUEFLOW_GROUP}
      - optional:nacos:venueflow-booking-service.yml?group=${VENUEFLOW_NACOS_GROUP:VENUEFLOW_GROUP}
  cloud:
    discovery:
      enabled: true
    service-registry:
      auto-registration:
        enabled: true
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${VENUEFLOW_COLLABORATOR_CONNECT_TIMEOUT_MS:1000}
            read-timeout: ${VENUEFLOW_COLLABORATOR_REQUEST_TIMEOUT_MS:2000}
            logger-level: basic
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        enabled: true
        namespace: ${NACOS_NAMESPACE}
        group: ${VENUEFLOW_NACOS_GROUP:VENUEFLOW_GROUP}
        instance-id: ${VENUEFLOW_INSTANCE_ID:${spring.application.name}-${server.port}}
      config:
        enabled: true
        namespace: ${NACOS_NAMESPACE}
        group: ${VENUEFLOW_NACOS_GROUP:VENUEFLOW_GROUP}
