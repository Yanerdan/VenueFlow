spring:
  config:
    activate:
      on-profile: gateway
  codec:
    max-in-memory-size: 1MB
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

venueflow:
  gateway:
    issuer: ${VENUEFLOW_AUTH_ISSUER:venueflow-auth-service}
    jwt-public-key: ${JWT_PUBLIC_KEY}
    auth-uri: ${VENUEFLOW_GATEWAY_AUTH_URI:http://127.0.0.1:8081}
    user-uri: ${VENUEFLOW_GATEWAY_USER_URI:http://127.0.0.1:8082}
    resource-uri: ${VENUEFLOW_GATEWAY_RESOURCE_URI:http://127.0.0.1:8083}
    booking-uri: ${VENUEFLOW_GATEWAY_BOOKING_URI:http://127.0.0.1:8084}
    search-uri: ${VENUEFLOW_GATEWAY_SEARCH_URI:http://127.0.0.1:8086}
    allowed-origins: ${VENUEFLOW_GATEWAY_ALLOWED_ORIGINS:http://127.0.0.1:3000}
    max-request-bytes: ${VENUEFLOW_GATEWAY_MAX_REQUEST_BYTES:1048576}
