spring:
  application:
    name: venueflow-booking-service
  profiles:
    default: skeleton

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
