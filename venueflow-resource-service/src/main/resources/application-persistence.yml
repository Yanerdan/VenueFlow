spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:./secrets/local-dev/local-dev.env[.properties]
      - optional:file:../secrets/local-dev/local-dev.env[.properties]

  datasource:
    url: ${VENUEFLOW_RESOURCE_DB_URL}
    username: ${VENUEFLOW_RESOURCE_DB_USERNAME}
    password: ${VENUEFLOW_RESOURCE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: none

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
