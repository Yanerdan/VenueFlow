spring:
  config:
    activate:
      on-profile: persistence
  datasource:
    url: ${VENUEFLOW_AUTH_DB_URL}
    username: ${VENUEFLOW_AUTH_DB_USERNAME}
    password: ${VENUEFLOW_AUTH_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  sql:
    init:
      mode: never

venueflow:
  auth:
    issuer: ${VENUEFLOW_AUTH_ISSUER:venueflow-auth-service}
    access-token-ttl: ${VENUEFLOW_AUTH_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${VENUEFLOW_AUTH_REFRESH_TOKEN_TTL:P7D}
    max-login-attempts: ${VENUEFLOW_AUTH_MAX_LOGIN_ATTEMPTS:5}
    lockout-duration: ${VENUEFLOW_AUTH_LOCKOUT_DURATION:PT15M}
    jwt-private-key: ${JWT_PRIVATE_KEY}
    jwt-public-key: ${JWT_PUBLIC_KEY}
    bootstrap-admin-username: ${VENUEFLOW_BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-admin-password: ${VENUEFLOW_BOOTSTRAP_ADMIN_PASSWORD:}
    local-login-enabled: ${VENUEFLOW_AUTH_LOCAL_LOGIN_ENABLED:true}
    oidc:
      enabled: ${VENUEFLOW_OIDC_ENABLED:false}
      provider-key: ${VENUEFLOW_OIDC_PROVIDER_KEY:campus}
      display-name: ${VENUEFLOW_OIDC_DISPLAY_NAME:校园统一身份认证}
      issuer-uri: ${VENUEFLOW_OIDC_ISSUER_URI:}
      authorization-uri: ${VENUEFLOW_OIDC_AUTHORIZATION_URI:}
      token-uri: ${VENUEFLOW_OIDC_TOKEN_URI:}
      jwk-set-uri: ${VENUEFLOW_OIDC_JWK_SET_URI:}
      client-id: ${VENUEFLOW_OIDC_CLIENT_ID:}
      client-secret: ${VENUEFLOW_OIDC_CLIENT_SECRET:}
      callback-uri: ${VENUEFLOW_OIDC_CALLBACK_URI:}
      browser-return-uri: ${VENUEFLOW_OIDC_BROWSER_RETURN_URI:}
      username-claim: ${VENUEFLOW_OIDC_USERNAME_CLAIM:preferred_username}
      campus-id-claim: ${VENUEFLOW_OIDC_CAMPUS_ID_CLAIM:campus_id}
      scopes: ${VENUEFLOW_OIDC_SCOPES:openid profile}
